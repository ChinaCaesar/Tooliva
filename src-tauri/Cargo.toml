[package]
name = "desktop-toolbox"
version = "0.1.0"
description = "Desktop Toolbox powered by Tauri 2"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.1", features = [] }

[profile.dev]
debug = 0
incremental = false

