[package]
name = "desktop-toolbox"
version = "0.1.0"
description = "Desktop Toolbox powered by Tauri 2"
authors = ["Desktop Toolbox Team"]
edition = "2021"

[lib]
name = "desktop_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tauri = { version = "2.10.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-deep-link = "2.4"
tauri-plugin-opener = "2.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
image = { version = "0.25", default-features = true }
imageproc = "0.25"
ab_glyph = "0.2"

[profile.dev]
debug = 0
incremental = false

